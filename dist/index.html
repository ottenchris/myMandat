<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102653" />
    <meta name="description" content="Local-first Prototyp für kontinuierliche demokratische Teilhabe." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23102653'/%3E%3Cpath d='M17 46V18h8l7 12 7-12h8v28h-8V31l-7 11-7-11v15z' fill='%23f4d44d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mein Mandat – Demokratie, die bei dir bleibt</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">M</span><span>MEIN<br />MANDAT</span></div>
        <nav aria-label="Hauptnavigation">
          <button class="nav-button active" data-view="today"><span>◉</span>Heute</button>
          <button class="nav-button" data-view="history"><span>◫</span>Verlauf</button>
          <button class="nav-button" data-view="match"><span>≈</span>Vergleich</button>
          <button class="nav-button" data-view="privacy"><span>◇</span>Privatsphäre</button>
        </nav>
        <div class="local-note"><span class="pulse"></span>Lokal gespeichert<br /><small>Keine Stimme verlässt dein Gerät</small></div>
      </aside>

      <main>
        <header class="topbar">
          <div><span class="demo-pill">INTERAKTIVER PROTOTYP · BEISPIELDATEN</span><h1 id="page-title">Dein digitales Mandat</h1></div>
          <div class="parliament-switch" role="group" aria-label="Parlament auswählen">
            <button class="active" data-parliament="eu">EU-Parlament</button>
            <button data-parliament="bundestag">Bundestag</button>
          </div>
        </header>
        <div id="app-content"></div>
      </main>

      <nav class="mobile-nav" aria-label="Mobile Hauptnavigation">
        <button class="nav-button active" data-view="today"><span>◉</span>Heute</button>
        <button class="nav-button" data-view="history"><span>◫</span>Verlauf</button>
        <button class="nav-button" data-view="match"><span>≈</span>Vergleich</button>
        <button class="nav-button" data-view="privacy"><span>◇</span>Privat</button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
